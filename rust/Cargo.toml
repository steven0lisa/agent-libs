[package]
name = "agentlib"
version = "0.1.0"
edition = "2021"
authors = ["RootCloud Platform Team"]
description = "Rust Agent library with Anthropic API integration"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
tracing = "0.1"
bytes = "1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"
